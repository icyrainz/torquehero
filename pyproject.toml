[project]
name = "torquehero"
version = "0.1.0"
description = "Rhythm game played on a sim-racing rig: each control owns one layer of the song."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "raylib>=5.5",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
stems = ["demucs>=4.0", "torch==2.11.0", "torchaudio==2.11.0"]  # one version on every platform (Windows: +cu128)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# stems extra: CUDA torch on Windows (RTX 50-series cards need CUDA 12.8+), PyPI elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
torquehero = "torquehero.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torquehero"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
